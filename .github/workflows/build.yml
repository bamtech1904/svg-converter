name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"] # v1.2.3 形式のタグを push すると GitHub Release まで作る
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SvgConverter-windows
          - os: macos-latest # Apple Silicon
            artifact: SvgConverter-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --windowed --name SvgConverter app.py

      # upload-artifact は実行権限やシンボリックリンクを保持しないため、先に zip にする
      # zip の最上位に「アプリ本体」と「licenses フォルダ」を並べる
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto dist/SvgConverter.app package/SvgConverter.app
          python scripts/collect_licenses.py package/licenses
          ditto -c -k package ${{ matrix.artifact }}.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/collect_licenses.py dist/SvgConverter/licenses
          Compress-Archive -Path dist/SvgConverter -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release の作成に必要
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true # 両 OS の zip を同じフォルダに置く
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SVG Converter $GITHUB_REF_NAME" \
            --generate-notes \
            SvgConverter-windows.zip SvgConverter-macos.zip
